name: OpenVela CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      max-targets:
        description: Maximum targets per testlist. Use 0 for all targets.
        required: true
        default: "0"
        type: string
      jobs:
        description: Build parallelism.
        required: true
        default: "4"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        testlist:
          - arm-01
          - arm-02
          - arm-03
          - arm-04
          - arm-05
          - arm-06
          - arm-07
          - arm-08
          - arm-09
          - arm-10
          - arm-11
          - arm-12
          - arm-13
          - arm-14
          - arm64-01
          - risc-v-01
          - risc-v-02
          - risc-v-03
          - risc-v-04
          - risc-v-05
          - risc-v-06
          - sim-01
          - sim-02
          - sim-03
          - x86_64-01
          - other
          - vela-arm-01
          - vela-arm64-01
          - vela-x86_64-01
    name: ${{ matrix.testlist }}
    uses: szafonimateusz-mi/public-actions/.github/workflows/openvela-repo-ci.yml@trunk
    with:
      image: ghcr.io/szafonimateusz-mi/openvela-ci-linux:latest
      ci-assets-repository: szafonimateusz-mi/public-actions
      ci-assets-ref: trunk
      manifest-branch: dev
      repo-path: nuttx
      testlist: tools/ci/testlist/${{ matrix.testlist }}.dat
      max-targets: ${{ github.event_name == 'workflow_dispatch' && inputs.max-targets || '0' }}
      jobs: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs || '4' }}
      artifact-name: openvela-ci-${{ matrix.testlist }}

  citest:
    uses: szafonimateusz-mi/public-actions/.github/workflows/openvela-repo-ci.yml@trunk
    with:
      image: ghcr.io/szafonimateusz-mi/openvela-ci-linux:latest
      ci-assets-repository: szafonimateusz-mi/public-actions
      ci-assets-ref: trunk
      manifest-branch: dev
      repo-path: nuttx
      testlist: tools/ci/testlist/vela-citest.dat
      max-targets: ${{ github.event_name == 'workflow_dispatch' && inputs.max-targets || '0' }}
      jobs: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs || '4' }}
      run-runtime-tests: true
      require-runtime-tests: true
      artifact-name: openvela-ci-citest
