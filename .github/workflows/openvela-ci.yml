name: OpenVela CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      max-targets:
        description: Maximum targets per testlist. Use 0 for all targets.
        required: true
        default: "0"
        type: string
      jobs:
        description: Build parallelism.
        required: true
        default: "4"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Intentionally small starter set: the OpenVela vendor groups plus
        # one proven-green upstream representative per architecture. This CI
        # delivers the infrastructure; broken tree/toolchain targets are
        # fixed separately. Re-enable more upstream groups as they are
        # brought to green:
        #   arm-01 arm-02 arm-03 arm-05..arm-14 arm64-01 risc-v-01
        #   risc-v-03 risc-v-04 risc-v-05 risc-v-06 sim-02 sim-03
        #   x86_64-01 other
        testlist:
          - arm-04
          - risc-v-02
          - sim-01
          - vela-arm-01
          - vela-arm64-01
          - vela-x86_64-01
    name: ${{ matrix.testlist }}
    uses: szafonimateusz-mi/public-actions/.github/workflows/openvela-repo-ci.yml@trunk
    with:
      image: ghcr.io/szafonimateusz-mi/openvela-ci-linux:latest
      ci-assets-repository: szafonimateusz-mi/public-actions
      ci-assets-ref: trunk
      manifest-branch: dev
      repo-path: nuttx
      testlist: tools/ci/testlist/${{ matrix.testlist }}.dat
      max-targets: ${{ github.event_name == 'workflow_dispatch' && inputs.max-targets || '0' }}
      jobs: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs || '4' }}
      artifact-name: openvela-ci-${{ matrix.testlist }}

  # Dispatch-only until the in-tree libc++ constexpr bug is fixed
  # (include/libcxx/string operator""s rejected by host GCC; blocks the
  # sim:citest build and therefore the NTFC runtime path).
  citest:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: szafonimateusz-mi/public-actions/.github/workflows/openvela-repo-ci.yml@trunk
    with:
      image: ghcr.io/szafonimateusz-mi/openvela-ci-linux:latest
      ci-assets-repository: szafonimateusz-mi/public-actions
      ci-assets-ref: trunk
      manifest-branch: dev
      repo-path: nuttx
      testlist: tools/ci/testlist/vela-citest.dat
      max-targets: ${{ github.event_name == 'workflow_dispatch' && inputs.max-targets || '0' }}
      jobs: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs || '4' }}
      run-runtime-tests: true
      require-runtime-tests: true
      artifact-name: openvela-ci-citest
